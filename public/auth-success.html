<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connected</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .box {
      text-align: center;
      padding: 40px 48px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 52px;
      height: 52px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
    p  { margin: 0; font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>Connected!</h2>
    <p>This window will close automatically.</p>
  </div>
  <script>
    // Notify the opener and close
    try {
      if (window.opener) {
        window.opener.postMessage('oauth_success', '*');
      }
    } catch (e) {}
    setTimeout(() => window.close(), 800);
  </script>
</body>
</html>
